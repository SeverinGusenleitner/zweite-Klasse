<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startercode</title>
</head>
<body>
    <div id="container">
        <h2>Bar Sorter</h2>
        <svg id="canvas" width = "600" height ="400"></svg>
        <div>
            <input id="slider"type="range" min="0" max="400">
            <button id="set-btn">Set</button>
        </div>
        <div>
            <button id="randomize-btn">Randomize</button>
            <select name="select" id="sort-algorithm-select">
                <option value="bubble-sort">bubble-sort</option>
                <option value="quick-sort">quick-sort</option>
                <option value="merge-sort">merge-sort</option>
                <option value="insertion-sort">insertion-sort</option>
            </select>
            <button id="sort-btn">Sort</button>
        </div>
    </div>
    <script src="./src/index.ts" type="module"></script>
</body>
</html>
